<style>

}

.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.field label{font-weight:750;font-size:14px}.field input{height:52px;border:1px solid #dfe7e3;border-radius:14px;padding:0 15px;outline:none;transition:.2s;background:#fcfefd}.field input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,169,112,.12)}

.error{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--red-soft);color:#a63d3d;font-size:14px;line-height:1.55}
#app{min-height:100vh;display:flex}.sidebar{width:250px;background:var(--navy);color:#dbe4ef;position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column}.sidebar-header{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}.logo-row{display:flex;align-items:center;gap:12px}.mini-mark{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:900}.logo-title{font-weight:850;color:#fff}.logo-sub{font-size:11px;color:#95a5b9;margin-top:2px}.user-box{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}.user-name{color:#fff;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-meta{font-size:12px;color:#96a5b8;margin-top:3px}.nav{padding:16px 10px;display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#b9c5d4;text-align:left;padding:11px 13px;border-radius:12px;font-weight:700;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:rgba(0,169,112,.16);color:#fff}.nav .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}.sidebar-footer{margin-top:auto;padding:18px 20px;color:#7f8da0;font-size:11px;border-top:1px solid rgba(255,255,255,.08)}
.main{margin-left:250px;flex:1;min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.topbar-left{display:flex;align-items:center;gap:10px}.page-title{font-size:22px;font-weight:850}.page-sub{color:var(--muted);font-size:12px;margin-top:3px}.top-actions{display:flex;align-items:center;gap:10px}.period-select{height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;font-weight:700;color:var(--text)}.logout{height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 14px;font-weight:700;color:var(--text)}
.content{padding:28px 30px 44px;max-width:1600px;margin:auto}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.kpi .label{font-size:12px;color:var(--muted);font-weight:750}.kpi .value{font-size:29px;font-weight:900;margin-top:8px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}.kpi.green .value{color:var(--green)}.kpi.red .value{color:var(--red)}.kpi.amber .value{color:var(--amber)}.kpi.blue .value{color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.card h3{margin:0;font-size:16px}.section-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}.two{grid-template-columns:1.35fr .95fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.chart-wrap{height:310px}.chart-wrap.tall{height:380px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#f1f4f7;color:#455367}.badge.green{background:var(--green-soft);color:var(--green-dark)}.badge.red{background:var(--red-soft);color:#b74545}.badge.amber{background:var(--amber-soft);color:#9a6900}.badge.blue{background:var(--blue-soft);color:#3b66a3}.badge.gray{background:#f1f4f7;color:#59677a}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #eef1f4;text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafb;color:#5b687a;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}.table tr:hover td{background:#fbfdfc}.link{color:var(--green-dark);font-weight:800;text-decoration:none;cursor:pointer}.score{font-weight:900}.score.good{color:#10805b}.score.mid{color:#8a6900}.score.low{color:#ba4545}.change-up{color:#10805b;font-weight:850}.change-down{color:#ba4545;font-weight:850}.change-flat{color:#6b7280;font-weight:850}
.progress{height:8px;background:#eef2f3;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);border-radius:999px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filters input,.filters select{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;outline:none;min-width:180px}.filters input:focus,.filters select:focus{border-color:var(--green)}.filters .compact-input{min-width:120px;width:120px}.filters .compact-select{min-width:150px}.low-perf-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.low-perf-summary .badge{font-size:12px}.title-special{font-size:12px;color:#b9c5d4;margin-top:4px;font-weight:700;line-height:1.35}
.drill{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.crumb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:#586579;cursor:pointer}.crumb.active{background:var(--green-soft);color:var(--green-dark);border-color:#bdeedb}.person-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}.person-main{display:flex;gap:14px;align-items:center}.avatar{width:56px;height:56px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}.person-name{font-size:22px;font-weight:900}.person-meta{font-size:12px;color:var(--muted);margin-top:4px}.score-hero{font-size:44px;font-weight:950;color:var(--green)}.detail-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.detail-item{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc}.detail-item .small{font-size:11px;color:var(--muted)}.detail-item .big{font-size:22px;font-weight:900;margin-top:3px}
.question-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.question-top{display:flex;justify-content:space-between;gap:12px}.q-text{font-weight:800;line-height:1.55}.answer-line{margin-top:10px;font-size:13px}.answer-your{color:#a34747}.answer-correct{color:var(--green-dark)}.reference{margin-top:11px;padding:10px 12px;border-radius:10px;background:#f7faf9;border-left:4px solid var(--green);font-size:12px;color:#536173;line-height:1.55}.empty{padding:38px 15px;text-align:center;color:var(--muted)}.empty strong{color:var(--text);display:block;margin-bottom:6px}.alert{padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:16px;line-height:1.6}.alert.info{background:var(--blue-soft);color:#345f9b}.alert.warn{background:var(--amber-soft);color:#7f5a00}.alert.danger{background:var(--red-soft);color:#9c3f3f}.stat-line{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #eef1f4}.stat-line:last-child{border-bottom:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.movement-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfdfc}.movement-card .title{font-size:12px;color:var(--muted)}.movement-card .value{font-size:24px;font-weight:900;margin-top:6px}.small-table{min-width:0}.small-table th,.small-table td{padding:10px 11px;font-size:12px}.mobile-nav{display:none}.modal{position:fixed;inset:0;background:rgba(8,20,34,.45);z-index:70;display:grid;place-items:center;padding:18px}.modal-card{width:min(1100px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.mobile-overlay{display:none}.menu-toggle{display:none;border:0;background:transparent;color:var(--navy);font-size:24px;width:42px;height:42px;border-radius:12px}
.security-note{border-left:4px solid var(--amber);background:var(--amber-soft);padding:12px 14px;border-radius:12px;font-size:13px;color:#7f5a00;margin-bottom:16px}.device-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fbfdfc}.device-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.device-id{font-weight:900;color:var(--navy)}.device-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}.code-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.code-pill{padding:6px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.detail-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){.sidebar{transform:translateX(-105%);transition:transform .22s ease}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu-toggle{display:inline-grid;place-items:center}.topbar{padding:0 16px;height:auto;min-height:72px;gap:10px}.top-actions{gap:6px}.period-select{max-width:165px}.content{padding:18px 16px 32px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three,.four,.split{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-wrap{height:270px}.mobile-overlay.open{display:block;position:fixed;inset:0;background:rgba(8,20,34,.38);z-index:35}.table-wrap{border-radius:12px}.page-title{font-size:18px}.page-sub{font-size:11px}.mobile-nav{display:none}}
@media(max-width:520px){.login-card{padding:26px 20px}.kpis{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.topbar{flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.topbar-left{width:100%}.top-actions{width:100%;justify-content:flex-end;flex-wrap:wrap}.top-actions .logout{padding:0 10px}.period-select{min-width:0;max-width:145px;flex:1 1 145px}}
</style>
</head>
<body>
<section id="loginView">
  <div class="login-card">
    <div class="brand-mark">✓</div>
    <h1>Employee Assessment Portal</h1>
    <p class="subtitle">Monthly performance, completion and history</p>
    <div class="field">
      <label for="loginCode">Functional Code</label>
      <input id="loginCode" type="text" inputmode="numeric" autocomplete="off" placeholder="Enter functional code" />
    </div>
    <div id="loginError" class="error hidden"></div>
    <button id="loginBtn" class="primary">Login</button>
  </div>
</section>

<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-row"><div class="mini-mark">✓</div><div><div class="logo-title">Assessment Portal</div><div class="logo-sub">August + September 2026</div></div></div>
    </div>
    <div class="user-box"><div id="sideUserName" class="user-name"></div><div id="sideUserTitle" class="title-special hidden"></div><div id="sideUserMeta" class="user-meta"></div></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-footer">Monthly employee assessment reporting<br><span id="sessionNote">Login session: 1 hour</span></div>
  </aside>
  <div id="mobileOverlay" class="mobile-overlay"></div>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left"><button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">☰</button><div><div id="pageTitle" class="page-title"></div><div id="pageSub" class="page-sub"></div></div></div>
      <div class="top-actions"><select id="periodSelect" class="period-select" aria-label="Assessment period"></select><span id="roleChip" class="badge green"></span><button id="logoutBtn" class="logout">Logout</button></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<script>
const DATA={months:{},questions:{},hierarchies:{},allResults:[]};
const STATE={user:null,page:'dashboard',period:null,previousPeriod:null,selectedEmployee:null,selectedLocation:null,returnPage:'performance',charts:{},lowPerf:null};
const SESSION_KEY='assessmentPortalSession_v3';
const SESSION_TTL_MS=60*60*1000;
const SECURITY_AUDIT_CODES=new Set(['30020897']);
const $=id=>document.getElementById(id);
const $$=selector=>Array.from(document.querySelectorAll(selector));

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=v=>String(v??'').trim();
const code=v=>norm(v).replace(/\.0$/,'');
const lower=v=>norm(v).toLowerCase();
const pct=v=>{const n=Number(v);return Number.isFinite(n)?`${n.toFixed(1).replace(/\.0$/,'')}%`:'—';};
const scoreClass=v=>{const n=Number(v);return n>=85?'good':n>=70?'mid':'low';};
const initials=name=>norm(name).split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'A';
const average=rows=>{const vals=rows.map(r=>Number(r?._score ?? r?.score_percentage)).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;};
const displayMonth=p=>p==='Sep 2026'?'September 2026':p;
function parseDate(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number'&&Number.isFinite(v)) return new Date((v-25569)*86400000);
  const d=new Date(v); return Number.isNaN(d.getTime())?null:d;
}
function dateMs(v){const d=parseDate(v);return d?d.getTime():0;}
function formatDateTime(v){const d=parseDate(v);if(!d)return '—';return new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short'}).format(d);}
function isCompleted(r){const s=norm(r?.result_status);return !s||s==='Completed';}
function isEligible(h){return /(^|[^a-z])(lead|supervisor)([^a-z]|$)/i.test(norm(h?.Position));}
function sectionKey(section){const s=norm(section); if(s==='MF'||s.includes('المتناهي'))return 'MF'; if(s==='CF'||s.includes('الاستهلاكي'))return 'CF'; if(s==='Gam3ya'||s.includes('الجمعية'))return 'Gam3ya'; if(s==='Investment'||s.includes('الاستثمار'))return 'Investment'; return s;}
function sectionLabel(key){return ({MF:'MF',CF:'CF',Gam3ya:'Gam3ya',Investment:'Investment'})[key]||key||'—';}
function monthOrder(a,b){const order={'August 2026':202608,'Sep 2026':202609,'September 2026':202609}; return (order[a]||0)-(order[b]||0);}
function periods(){return Object.keys(DATA.months).sort(monthOrder);}
function hierarchyFor(period){return DATA.hierarchies[period]||[];}
function hierarchyMap(period){const m=new Map();hierarchyFor(period).forEach(h=>m.set(code(h['Functional Code']),h));return m;}
function employeeFromAnyHierarchy(c){for(const p of periods().slice().sort((a,b)=>monthOrder(b,a))){const h=hierarchyMap(p).get(code(c));if(h)return h;}return null;}
function latestRawByCode(period){
  const rows=(DATA.months[period]?.results||[]).filter(r=>code(r.functional_code));
  const m=new Map();
  for(const r of rows){const c=code(r.functional_code);const prev=m.get(c);if(!prev||dateMs(r.completion_timestamp||r.start_timestamp)>=dateMs(prev.completion_timestamp||prev.start_timestamp))m.set(c,r);}return m;
}
function latestCompletedByCode(period){
  const rows=(DATA.months[period]?.results||[]).filter(r=>code(r.functional_code)&&isCompleted(r));
  const m=new Map();
  for(const r of rows){const c=code(r.functional_code);const prev=m.get(c);if(!prev||dateMs(r.completion_timestamp||r.start_timestamp)>=dateMs(prev.completion_timestamp||prev.start_timestamp))m.set(c,r);}return m;
}
function previousPeriod(period){const ps=periods();const i=ps.indexOf(period);return i>0?ps[i-1]:null;}
function computeCorrect(r,qs){let c=0;for(let i=1;i<=qs.length;i++){if(norm(r[`q${i}`]).toUpperCase()===norm(qs[i-1]?.['Correct Option']).toUpperCase())c++;}return c;}
function enrichResult(r,period){
  const hmap=hierarchyMap(period), h=hmap.get(code(r.functional_code))||null, qs=DATA.questions[period]||[];
  const score=Number(r.score_percentage);
  const computed=qs.length?Math.round(computeCorrect(r,qs)/qs.length*10000)/100:NaN;
  const finalScore=Number.isFinite(score)?score:(Number.isFinite(computed)?computed:NaN);
  const products={};
  for(const p of ['MF','CF','Gam3ya','Investment']){
    const idxs=qs.map((q,i)=>sectionKey(q.Section)===p?i+1:null).filter(Boolean);
    const good=idxs.filter(i=>norm(r[`q${i}`]).toUpperCase()===norm(qs[i-1]?.['Correct Option']).toUpperCase()).length;
    products[p]=idxs.length?good/idxs.length*100:NaN;
  }
  return {...r,_period:period,_code:code(r.functional_code),_h:h,_eligible:!!h&&isEligible(h),_displayName:h?norm(h['Employee Name']):norm(r.participant_name)||code(r.functional_code),_score:finalScore,_products:products,_computedScore:computed};
}
function currentResults(period){return Array.from(latestCompletedByCode(period).values()).map(r=>enrichResult(r,period));}
function rawResults(period){return (DATA.months[period]?.results||[]).filter(r=>code(r.functional_code)).map(r=>enrichResult(r,period));}
function visibleEmployees(user,period){
  const hs=hierarchyFor(period);
  const map=new Map(hs.map(h=>[code(h['Functional Code']),h]));
  const userCode=code(user?.['Functional Code']);
  const periodUser=map.get(userCode)||null;
  const source=periodUser||user;
  const role=roleOf(source);
  if(role==='Director / Head')return hs.slice();
  const ownerCode=code(source?.['Scope Owner Code']);
  const owner=ownerCode?(map.get(ownerCode)||source):source;
  if(role==='Regional Manager'||role==='City Manager'){
    const by=new Map();for(const h of hs){const p=code(h['Direct Manager Code']);if(!by.has(p))by.set(p,[]);by.get(p).push(h);}
    const out=[];const stack=[code(owner?.['Functional Code'])];const seen=new Set();
    while(stack.length){const x=stack.pop();if(seen.has(x))continue;seen.add(x);for(const child of (by.get(x)||[])){out.push(child);stack.push(code(child['Functional Code']));}}
    return out;
  }
  return owner?[owner]:[];
}
function scopeEmployees(user,period){return visibleEmployees(user,period).filter(isEligible);}
function scopeSubmittedResults(user,period){
  const all=currentResults(period), role=roleOf(user);
  if(role==='Director / Head')return all;
  const visible=new Set(visibleEmployees(user,period).map(h=>code(h['Functional Code'])));
  return all.filter(r=>visible.has(r._code));
}
function scopePopulationRecords(user,period){
  const eligible=scopeEmployees(user,period);const submitted=scopeSubmittedResults(user,period);const map=new Map();
  for(const h of eligible){const c=code(h['Functional Code']);map.set(c,{code:c,h,result:null,eligible:true,submitted:false});}
  for(const r of submitted){if(!map.has(r._code))map.set(r._code,{code:r._code,h:r._h||null,result:r,eligible:false,submitted:true});else{const x=map.get(r._code);x.result=r;x.submitted=true;}}
  return Array.from(map.values());
}
function pendingEmployees(user,period){const completed=latestCompletedByCode(period);return scopeEmployees(user,period).filter(h=>!completed.has(code(h['Functional Code'])));}
function findUser(c){return hierarchyFor('Sep 2026').find(h=>code(h['Functional Code'])===code(c))||hierarchyFor('September 2026').find(h=>code(h['Functional Code'])===code(c));}
function roleOf(u){const al=norm(u?.['Access Level']);if(al==='Director / Head')return 'Director / Head';if(al==='Regional Manager')return 'Regional Manager';if(al==='City Manager')return 'City Manager';if(u&&isEligible(u))return 'Lead / Supervisor';return al||'Viewer';}
function canAccessEmployee(h,period){
  const role=roleOf(STATE.user);
  if(role==='Director / Head')return true;

function renderPerfTable(data){const q=lower($('perfSearch')?.value);const rows=data.filter(r=>!q||lower(r._displayName).includes(q)||lower(r._code).includes(q));$('perfTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Position</th><th>Governorate</th><th>Status</th><th>${esc(displayMonth(STATE.period))}</th><th>${esc(STATE.previousPeriod?displayMonth(STATE.previousPeriod):'Previous')}</th><th>Average</th><th>Change</th><th>MF</th><th>CF</th><th>Gam3ya</th><th>Investment</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="link" data-emp="${esc(r._code)}">${esc(r._displayName)}</span></td><td>${esc(r._h?.Position||'—')}</td><td>${esc(r._h?.Governorate||r.governorate||'—')}</td><td>${r._eligible?'<span class="badge green">Required</span>':'<span class="badge gray">Not Required / Additional</span>'}</td><td class="score ${scoreClass(r._score)}">${pct(r._score)}</td><td>${Number.isFinite(r._prevScore)?pct(r._prevScore):'—'}</td><td>${pct(r._avg)}</td><td>${Number.isFinite(r._prevScore)?changeText(r._score-r._prevScore):'—'}</td><td>${pct(r._products.MF)}</td><td>${pct(r._products.CF)}</td><td>${pct(r._products.Gam3ya)}</td><td>${pct(r._products.Investment)}</td></tr>`).join('')}</tbody></table></div>`;wireEmployeeLinks();}
function pendingTable(rows){const sorted=rows.slice().sort((a,b)=>`${a['Region']}|${a['Governorate']}|${a['City']}|${a['Employee Name']}`.localeCompare(`${b['Region']}|${b['Governorate']}|${b['City']}|${b['Employee Name']}`));return `<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Position</th><th>Region</th><th>Governorate</th><th>City</th><th>Code</th></tr></thead><tbody>${sorted.map(h=>`<tr><td><span class="link" data-emp="${esc(h._code||code(h['Functional Code']))}">${esc(h['Employee Name'])}</span></td><td>${esc(h['Position'])}</td><td>${esc(h['Region'])}</td><td>${esc(h['Governorate'])}</td><td>${esc(h['City'])}</td><td><span class="link" data-emp="${esc(h._code||code(h['Functional Code']))}">${esc(h._code||code(h['Functional Code']))}</span></td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${sorted.map(h=>`<div class="mobile-pending-card" data-emp="${esc(h._code||code(h['Functional Code']))}"><div class="mobile-pending-head"><div><div class="mobile-rank-name">${esc(h['Employee Name'])}</div><div class="mobile-pending-meta">${esc(h['Position'])} · ${esc(h['Governorate']||'—')} · ${esc(h['City']||'—')}</div><div class="mobile-pending-meta">${esc(h['Region']||'—')} · ${esc(h._code||code(h['Functional Code']))}</div></div><span class="badge amber">Pending</span></div></div>`).join('')}</div>`;}
function renderPending(){if(roleOf(STATE.user)==='Lead / Supervisor'){renderEmployeeDashboard();return;}const p=STATE.period,pending=pendingEmployees(STATE.user,p),grouped=new Map();for(const h of pending){const k=`${h['Region']}||${h['Governorate']}||${h['City']}`;if(!grouped.has(k))grouped.set(k,[]);grouped.get(k).push(h);}const entries=Array.from(grouped.entries()).sort();let html=`<div class="alert info">Pending counts are based on required Lead / Supervisor employees who do not have a completed result for the selected month.</div>`;if(!pending.length)html+='<div class="card empty"><strong>No pending employees.</strong>All required employees have a completed result.</div>';else for(const [g,rs] of entries){const [reg,gov,city]=g.split('||');html+=`<div class="card" style="margin-bottom:14px"><div class="card-head"><div><h3>${esc(gov)}${city&&city!==gov?' · '+esc(city):''}</h3><div class="section-note">${esc(reg)} · ${rs.length} pending</div></div></div>${pendingTable(rs)}</div>`;}$('content').innerHTML=html;wireEmployeeLinks();}
function renderLocations(){
  if(roleOf(STATE.user)==='Lead / Supervisor'){renderEmployeeDashboard();return;}
  const p=STATE.period,prev=STATE.previousPeriod,pop=scopePopulationRecords(STATE.user,p),results=scopeSubmittedResults(STATE.user,p),prevResults=prev?scopeSubmittedResults(STATE.user,prev):[];
  const groups=new Map();for(const x of pop){const name=x.h?.Governorate||x.result?.governorate||'—';if(!groups.has(name))groups.set(name,[]);groups.get(name).push(x);}
  const rows=Array.from(groups.entries()).map(([name,items])=>{const rs=items.filter(x=>x.result).map(x=>x.result);const prevMap=prev?latestCompletedByCode(prev):new Map();const prevRs=items.map(x=>prevMap.get(x.code)).filter(Boolean).map(r=>enrichResult(r,prev));return {name,population:items.length,completed:rs.length,pending:items.filter(x=>!x.result&&x.eligible).length,avg:average(rs),prevAvg:prevRs.length?average(prevRs):NaN};}).sort((a,b)=>b.completed-a.completed||b.avg-a.avg);
  $('content').innerHTML=`<div class="card"><div class="card-head"><div><h3>Authorized Locations — ${esc(displayMonth(p))}</h3><div class="section-note">Selected month with previous-month comparison. Click a governorate to drill down.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Governorate</th><th>Population</th><th>Completed</th><th>Pending</th><th>Completion</th><th>Average</th><th>Previous</th><th>Change</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="link" data-loc="${esc(r.name)}">${esc(r.name)}</span></td><td>${r.population}</td><td>${r.completed}</td><td>${r.pending}</td><td>${pct(r.population?r.completed/r.population*100:0)}</td><td class="score ${scoreClass(r.avg)}">${r.completed?pct(r.avg):'—'}</td><td>${Number.isFinite(r.prevAvg)?pct(r.prevAvg):'—'}</td><td>${Number.isFinite(r.prevAvg)?changeText(r.avg-r.prevAvg):'—'}</td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${rows.map(r=>`<div class="mobile-location-card" data-loc="${esc(r.name)}"><div class="mobile-rank-head"><div><div class="mobile-rank-name">${esc(r.name)}</div><div class="mobile-rank-meta">${r.population} total · ${r.completed} completed · ${r.pending} pending</div></div><div class="mobile-rank-score score ${scoreClass(r.avg)}">${r.completed?pct(r.avg):'—'}</div></div></div>`).join('')}</div></div><div id="locationDetail" style="margin-top:16px"></div>`;
  $$('[data-loc]').forEach(el=>el.addEventListener('click',()=>showLocation(el.dataset.loc)));
}
function showLocation(loc){
  const p=STATE.period,prev=STATE.previousPeriod;const pop=scopePopulationRecords(STATE.user,p).filter(x=>(x.h?.Governorate||x.result?.governorate||'—')===loc);const prior=prev?latestCompletedByCode(prev):new Map();
  const all=pop.map(x=>{const r=x.result;if(!r)return {_pending:true,_code:x.code,_displayName:x.h?.['Employee Name']||'—',_h:x.h};const pr=prior.get(x.code);return {...r,_prevScore:pr?enrichResult(pr,prev)._score:NaN};}).sort((a,b)=>String(a._displayName).localeCompare(String(b._displayName)));
  $('locationDetail').innerHTML=`<div class="card"><div class="card-head"><div><h3>${esc(loc)}</h3><div class="section-note">Employee-level drill down · ${all.length} people</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Position</th><th>Current</th><th>Previous</th><th>Change</th><th>Status</th></tr></thead><tbody>${all.map(r=>r._pending?`<tr><td><span class="link" data-emp="${esc(r._code)}">${esc(r._displayName)}</span></td><td>${esc(r._h?.Position||'—')}</td><td>—</td><td>—</td><td>—</td><td><span class="badge amber">Pending</span></td></tr>`:`<tr><td><span class="link" data-emp="${esc(r._code)}">${esc(r._displayName)}</span></td><td>${esc(r._h?.Position||'—')}</td><td class="score ${scoreClass(r._score)}">${pct(r._score)}</td><td>${Number.isFinite(r._prevScore)?pct(r._prevScore):'—'}</td><td>${Number.isFinite(r._prevScore)?changeText(r._score-r._prevScore):'—'}</td><td>${r._eligible?'<span class="badge green">Required</span>':'<span class="badge gray">Not Required</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;wireEmployeeLinks();}
function renderHistory(){const ps=periods();const rows=ps.map((p,i)=>{const rs=currentResults(p);const pop=scopePopulationRecords(STATE.user,p);const pen=pendingEmployees(STATE.user,p);return {p,completed:rs.length,population:pop.length,pending:pen.length,avg:average(rs),prev:i>0?average(currentResults(ps[i-1])):NaN};});$('content').innerHTML=`<div class="card"><div class="card-head"><div><h3>Assessment History</h3><div class="section-note">Historical month-level snapshot using each month's own hierarchy and question bank.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Population</th><th>Completed</th><th>Pending</th><th>Completion</th><th>Average</th><th>Change</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(displayMonth(r.p))}</td><td>${r.population}</td><td>${r.completed}</td><td>${r.pending}</td><td>${pct(r.population?r.completed/r.population*100:0)}</td><td class="score ${scoreClass(r.avg)}">${pct(r.avg)}</td><td>${Number.isFinite(r.prev)?changeText(r.avg-r.prev):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;}
function renderQuestions(){const p=STATE.period,qs=DATA.questions[p]||[];$('content').innerHTML=`<div class="card"><div class="card-head"><div><h3>${qs.length}-Question Reference Library — ${esc(displayMonth(p))}</h3><div class="section-note">Management reference only. Answer key and references for the selected month.</div></div></div>${qs.map((q,i)=>`<div class="question-card"><div class="question-top"><div><span class="badge green">${esc(q['Q#']||'Q'+(i+1))}</span> <span class="badge">${esc(sectionLabel(sectionKey(q.Section)))}</span></div><span class="badge blue">Correct: ${esc(q['Correct Option'])}</span></div><div class="q-text" style="margin-top:11px">${esc(q.Question)}</div><div class="answer-line answer-correct"><strong>Correct Answer:</strong> ${esc(q['Correct Answer'])}</div><div class="reference"><strong>Reference:</strong> ${esc(q.Reference||'—')}</div></div>`).join('')}</div>`;}
function renderQuality(){
  const p=STATE.period,qs=DATA.questions[p]||[],hm=hierarchyMap(p),raw=rawResults(p);let scoreMismatch=0,invalid=0;const dupCodes=[];const seen=new Set();for(const h of hierarchyFor(p)){const c=code(h['Functional Code']);if(seen.has(c)&&c)dupCodes.push(c);seen.add(c);}const rawCodes=raw.map(r=>r._code);const orphan=raw.filter(r=>!hm.has(r._code));const nonEligible=raw.filter(r=>hm.has(r._code)&&!isEligible(hm.get(r._code)));for(const r of raw){for(let i=1;i<=qs.length;i++){const a=norm(r[`q${i}`]).toUpperCase();if(a&&!['A','B','C','D'].includes(a))invalid++;}const comp=computeCorrect(r,qs);const stored=Number(r.total_correct);const storedPct=Number(r.score_percentage);if(Number.isFinite(stored)&&stored!==comp)scoreMismatch++;if(Number.isFinite(storedPct)&&Math.round(comp/qs.length*10000)/100!==Math.round(storedPct*100)/100)scoreMismatch++;}const pending=pendingEmployees(STATE.user,p);$('content').innerHTML=`<div class="grid four"><div class="kpi"><div class="label">Hierarchy Records</div><div class="value">${hierarchyFor(p).length}</div></div><div class="kpi green"><div class="label">Eligible</div><div class="value">${scopeEmployees(STATE.user,p).length}</div></div><div class="kpi"><div class="label">Current Completed Results</div><div class="value">${currentResults(p).length}</div></div><div class="kpi ${scoreMismatch||invalid?'red':'green'}"><div class="label">Answer / Score Issues</div><div class="value">${scoreMismatch+invalid}</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Integrity Checks — ${esc(displayMonth(p))}</h3><div style="margin-top:14px">${checkLine('Duplicate hierarchy codes',dupCodes.length,0)}${checkLine('Result codes missing from hierarchy',orphan.length,0)}${checkLine('Non-eligible results',nonEligible.length,null,true)}${checkLine('Required employees without completed result',pending.length,null,true)}${checkLine('Stored score/answer mismatches',scoreMismatch,0)}${checkLine('Invalid answer values',invalid,0)}</div></div><div class="card"><h3>Data Notes</h3><div class="stat-line"><span>Questions in month</span><strong>${qs.length}</strong></div><div class="stat-line"><span>Unique employee codes in results</span><strong>${new Set(rawCodes).size}</strong></div><div class="stat-line"><span>Raw submissions / unique codes</span><strong>${raw.length} / ${new Set(rawCodes).size}</strong></div><div class="alert info" style="margin-top:14px">Performance uses the latest completed submission per Functional Code for the selected month. Device audit retains all raw attempts, including Expired ones.</div></div></div>`;}
function checkLine(label,val,expected,warning=false){const ok=expected===null?true:val===expected;return `<div class="stat-line"><span>${esc(label)}</span><span class="badge ${ok?'green':warning?'amber':'red'}">${val}</span></div>`;}
function renderSecurity(){if(!SECURITY_AUDIT_CODES.has(code(STATE.user?.['Functional Code']))){$('content').innerHTML='<div class="card empty"><strong>Private view.</strong>This report is not available for this login.</div>';return;}const p=STATE.period;const raw=rawResults(p);const groups=new Map();for(const r of raw){const id=norm(r.device_id);if(!id)continue;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(r);}const devices=Array.from(groups.entries()).map(([id,rs])=>{const codes=[...new Set(rs.map(r=>r._code))];return {id,rs,codes,first:rs.slice().sort((a,b)=>dateMs(a.start_timestamp)-dateMs(b.start_timestamp))[0],last:rs.slice().sort((a,b)=>dateMs(a.completion_timestamp||a.start_timestamp)-dateMs(b.completion_timestamp||b.start_timestamp)).slice(-1)[0]};}).sort((a,b)=>b.codes.length-a.codes.length||b.rs.length-a.rs.length);$('content').innerHTML=`<div class="security-note"><strong>Private Device Abuse / Security Audit.</strong> Restricted to the authorized internal dashboard login.</div><div class="card"><div class="card-head"><div><h3>Device Activity — ${esc(displayMonth(p))}</h3><div class="section-note">Same Device ID is different from Same IP. A shared IP alone is not treated as proof of device reuse.</div></div><span class="badge amber">${devices.filter(d=>d.codes.length>1).length} multi-code device(s)</span></div>${devices.length?devices.map(d=>`<div class="device-card"><div class="device-head"><div><div class="device-id">${esc(d.id)}</div><div class="device-meta">Attempts: ${d.rs.length} · Functional Codes: ${d.codes.length}<br>First: ${formatDateTime(d.first?.start_timestamp)} · Last: ${formatDateTime(d.last?.completion_timestamp||d.last?.start_timestamp)}<br>Browser/OS: ${esc(d.last?.browser||'—')} ${esc(d.last?.browser_version||'')} · ${esc(d.last?.operating_system||'—')}<br>IP: ${esc(d.last?.ip_address||'Not captured')}</div></div><div>${d.codes.length>1?'<span class="badge red">Multiple Functional Codes</span>':'<span class="badge green">Single Functional Code</span>'}</div></div><div class="code-list">${d.codes.map(c=>`<span class="code-pill">${esc(c)}</span>`).join('')}</div><div style="margin-top:12px" class="table-wrap"><table class="table small-table"><thead><tr><th>Functional Code</th><th>Governorate</th><th>Status</th><th>Score</th><th>Start</th><th>Device/IP</th></tr></thead><tbody>${d.rs.map(r=>`<tr><td>${esc(r._code)}</td><td>${esc(r.governorate||r._h?.Governorate||'—')}</td><td>${esc(r.result_status||'Completed')}</td><td>${pct(r._score)}</td><td>${formatDateTime(r.start_timestamp)}</td><td>${esc(r.device_id||'—')}<br>${esc(r.ip_address||'—')}</td></tr>`).join('')}</tbody></table></div></div>`).join(''):'<div class="empty">No device identifiers were captured for this month.</div>'}</div>`;}
function employeeRecordFor(empCode,preferredPeriod){const h=hierarchyMap(preferredPeriod).get(code(empCode))||employeeFromAnyHierarchy(empCode);return h;}
function renderEmployeeDetail(empCode){
  const p=STATE.period,prev=STATE.previousPeriod,h=employeeRecordFor(empCode,p);if(!h||!canAccessEmployee(h,p))return;
  const cur=latestCompletedByCode(p).get(code(empCode));const prv=prev?latestCompletedByCode(prev).get(code(empCode)):null;const all=periods().map(m=>{const r=latestCompletedByCode(m).get(code(empCode));return r?enrichResult(r,m):null;}).filter(Boolean);const avg=all.length?average(all):NaN;const curR=cur?enrichResult(cur,p):null;const prevR=prv?enrichResult(prv,prev):null;const mgrCode=code(h['Direct Manager Code']);const mgr=hierarchyMap(p).get(mgrCode)||employeeFromAnyHierarchy(mgrCode);
  STATE.selectedEmployee=code(empCode);setHeader(h['Employee Name'],`${h['Position']} · ${h['Governorate']||'—'} · ${h['Region']||'—'}`);
  const score=curR?curR._score:(all.length?all.slice(-1)[0]._score:NaN);
  $('content').innerHTML=`<div class="drill"><button class="crumb active" id="backBtn">← Back</button><span class="crumb">Employee Profile</span></div><div class="card"><div class="person-head"><div class="person-main"><div class="avatar">${esc(initials(h['Employee Name']))}</div><div><div class="person-name">${esc(h['Employee Name'])}</div><div class="person-meta">${esc(h._code||code(h['Functional Code']))} · ${esc(h['Position'])} · ${esc(h['Governorate']||'—')} · ${esc(h['Region']||'—')} · ${esc(h['City']||'—')}</div><div class="person-meta">Manager: ${esc(mgr?.['Employee Name']||'—')}</div><div style="margin-top:8px">${h._eligible?'<span class="badge green">Required Assessment</span>':'<span class="badge gray">Not Required</span>'} ${curR?'<span class="badge blue">Current Completed</span>':'<span class="badge amber">Current Not Completed</span>'}</div></div></div><div class="score-hero">${Number.isFinite(score)?pct(score):'Pending'}</div></div></div>${employeeDetailHistory(curR,prevR,all,p,prev)}`;
  $('backBtn').onclick=()=>{STATE.page=STATE.returnPage||'performance';STATE.selectedEmployee=null;render();};
}
function employeeDetailHistory(cur,prev,all,p,prevP){const delta=cur&&prev?cur._score-prev._score:NaN;let html=`<div class="grid detail-grid" style="margin-top:16px">${[[displayMonth(p),cur?._score],[prevP?displayMonth(prevP):'Previous',prev?._score],['Average',average(all)],['Change',delta],['Months',all.length]].map(([l,v])=>`<div class="detail-item"><div class="small">${esc(l)}</div><div class="big ${l==='Change'?'':`score ${scoreClass(v)}`}" style="${l==='Change'?'color:var(--green)':''}">${l==='Change'?(Number.isFinite(v)?changeText(v):'—'):l==='Months'?esc(v):pct(v)}</div></div>`).join('')}</div>`;html+=`<div class="card" style="margin-top:16px"><div class="card-head"><div><h3>Assessment History</h3><div class="section-note">Historical result by month</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Overall</th><th>MF</th><th>CF</th><th>Gam3ya</th><th>Investment</th><th>Change</th></tr></thead><tbody>${all.map((r,i)=>`<tr><td>${esc(displayMonth(r._period))}</td><td class="score ${scoreClass(r._score)}">${pct(r._score)}</td><td>${pct(r._products.MF)}</td><td>${pct(r._products.CF)}</td><td>${pct(r._products.Gam3ya)}</td><td>${pct(r._products.Investment)}</td><td>${i?changeText(r._score-all[i-1]._score):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;if(cur)html+=`<div class="card" style="margin-top:16px">${incorrectBlock(incorrectQuestions(cur),cur._period)}</div>`;return html;}
function wireEmployeeLinks(){$$('#content [data-emp]').forEach(el=>{if(el.dataset.wired==='1')return;el.dataset.wired='1';el.onclick=e=>{e.preventDefault();e.stopPropagation();STATE.returnPage=STATE.page;STATE.page='employee';STATE.selectedEmployee=code(el.dataset.emp);render();};});}
function boot(){
  Promise.all([loadWorkbook('results.xlsx'),loadWorkbook('question_bank.xlsx'),loadWorkbook('hierarchy.xlsx'),loadWorkbook('hierarchy_august.xlsx')]).then(([resultsWB,questionsWB,sepHierWB,augHierWB])=>{
    for(const s of resultsWB.SheetNames){const ws=resultsWB.Sheets[s];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});if(rows.length&&Object.prototype.hasOwnProperty.call(rows[0],'functional_code'))DATA.months[s]={results:rows};}
    for(const s of questionsWB.SheetNames){const ws=questionsWB.Sheets[s];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});if(rows.length&&Object.prototype.hasOwnProperty.call(rows[0],'Q#'))DATA.questions[s]=rows;}
    const sepSheet=sepHierWB.Sheets['Hierarchy']||sepHierWB.Sheets[sepHierWB.SheetNames.find(s=>s.toLowerCase().includes('hierarchy'))];
    const augSheet=augHierWB.Sheets['Hierarchy']||augHierWB.Sheets[augHierWB.SheetNames.find(s=>s.toLowerCase().includes('hierarchy'))];
    DATA.hierarchies['Sep 2026']=sepSheet?XLSX.utils.sheet_to_json(sepSheet,{defval:''}):[];
    DATA.hierarchies['August 2026']=augSheet?XLSX.utils.sheet_to_json(augSheet,{defval:''}):[];
    Object.values(DATA.hierarchies).forEach(rows=>rows.forEach(h=>{h._code=code(h['Functional Code']);h._eligible=isEligible(h);}));
    DATA.allResults=Object.values(DATA.months).flatMap(x=>x.results);
    if(!periods().length)throw new Error('No results sheets found');
    STATE.period=periods().slice(-1)[0];STATE.previousPeriod=previousPeriod(STATE.period);restoreSession();
    $('loginBtn').onclick=login;$('loginCode').addEventListener('keydown',e=>{if(e.key==='Enter')login();});$('menuToggle').onclick=()=>{const o=!$('sidebar').classList.contains('open');if(o){$('sidebar').classList.add('open');$('mobileOverlay').classList.add('open');$('menuToggle').setAttribute('aria-expanded','true')}else closeMobileMenu();};$('mobileOverlay').onclick=closeMobileMenu;window.addEventListener('resize',()=>{if(window.innerWidth>850)closeMobileMenu();});
  }).catch(err=>{console.error(err);showLoginError('Unable to load portal data. Keep results.xlsx, question_bank.xlsx, hierarchy.xlsx and hierarchy_august.xlsx beside index.html.');});
}
async function loadWorkbook(url){const res=await fetch(url);if(!res.ok)throw new Error(`Failed to fetch ${url}`);const ab=await res.arrayBuffer();return XLSX.read(ab,{type:'array'});}
boot();
