<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assessment Results Portal</title>
<meta name="description" content="Temporary employee assessment results portal" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --green:#00A970; --green-dark:#00885a; --green-soft:#e9fbf4; --navy:#0f1b2d; --navy-2:#16243a;
  --bg:#f5f8f7; --card:#ffffff; --text:#142033; --muted:#64748b; --line:#e5eaf0;
  --red:#dc4c4c; --red-soft:#fff1f1; --amber:#c88b00; --amber-soft:#fff7df; --blue:#3978d7; --blue-soft:#eef5ff;
  --shadow:0 10px 30px rgba(15,27,45,.08); --radius:18px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted)}
#loginView{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#dcfff0 0,transparent 30%),linear-gradient(135deg,#f7fbfa,#eef5f2)}
.login-card{width:min(460px,100%);background:#fff;border:1px solid #e7efec;border-radius:26px;padding:36px;box-shadow:0 22px 70px rgba(8,43,31,.12)}
.brand-mark{width:52px;height:52px;border-radius:16px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 8px 22px rgba(0,169,112,.25)}
.login-card h1{font-size:30px;line-height:1.15;margin:22px 0 8px}.login-card p{margin:0 0 24px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.field label{font-weight:700;font-size:14px}.field input{height:52px;border:1px solid #dfe7e3;border-radius:14px;padding:0 15px;outline:none;transition:.2s;background:#fcfefd}.field input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,169,112,.12)}
.primary{width:100%;height:52px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(0,169,112,.22)}.primary:hover{background:var(--green-dark)}
.error{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--red-soft);color:#a63d3d;font-size:14px}
#app{min-height:100vh;display:flex}.sidebar{width:250px;background:var(--navy);color:#dbe4ef;position:fixed;inset:0 auto 0 0;z-index:20;display:flex;flex-direction:column}
.sidebar-header{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}.logo-row{display:flex;align-items:center;gap:12px}.mini-mark{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:900}.logo-title{font-weight:850;color:#fff}.logo-sub{font-size:11px;color:#95a5b9;margin-top:2px}
.user-box{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}.user-name{color:#fff;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-meta{font-size:12px;color:#96a5b8;margin-top:3px}
.nav{padding:16px 10px;display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#b9c5d4;text-align:left;padding:11px 13px;border-radius:12px;font-weight:700;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:rgba(0,169,112,.16);color:#fff}.nav .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}
.sidebar-footer{margin-top:auto;padding:18px 20px;color:#7f8da0;font-size:11px;border-top:1px solid rgba(255,255,255,.08)}
.main{margin-left:250px;flex:1;min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}.page-title{font-size:22px;font-weight:850}.page-sub{color:var(--muted);font-size:12px;margin-top:3px}.top-actions{display:flex;align-items:center;gap:10px}.logout{height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 14px;font-weight:700;color:var(--text)}
.content{padding:28px 30px 40px;max-width:1600px;margin:auto}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.kpi .label{font-size:12px;color:var(--muted);font-weight:750}.kpi .value{font-size:30px;font-weight:900;margin-top:8px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:6px}.kpi.green .value{color:var(--green)}.kpi.red .value{color:var(--red)}.kpi.amber .value{color:var(--amber)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.card h3{margin:0;font-size:16px}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.section-note{font-size:12px;color:var(--muted)}
.two{grid-template-columns:1.3fr .9fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.chart-wrap{height:300px}.chart-wrap.tall{height:370px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#f1f4f7;color:#455367}.badge.green{background:var(--green-soft);color:var(--green-dark)}.badge.red{background:var(--red-soft);color:#b74545}.badge.amber{background:var(--amber-soft);color:#9a6900}.badge.blue{background:var(--blue-soft);color:#3b66a3}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #eef1f4;text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafb;color:#5b687a;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}.table tr:hover td{background:#fbfdfc}.link{color:var(--green-dark);font-weight:800;text-decoration:none;cursor:pointer}.score{font-weight:900}.score.good{color:#10805b}.score.mid{color:#8a6900}.score.low{color:#ba4545}
.progress{height:8px;background:#eef2f3;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);border-radius:999px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filters input,.filters select{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;outline:none;min-width:180px}.filters input:focus,.filters select:focus{border-color:var(--green)}
.drill{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.crumb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:#586579;cursor:pointer}.crumb.active{background:var(--green-soft);color:var(--green-dark);border-color:#bdeedb}
.person-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}.person-main{display:flex;gap:14px;align-items:center}.avatar{width:56px;height:56px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}.person-name{font-size:22px;font-weight:900}.person-meta{font-size:12px;color:var(--muted);margin-top:4px}.score-hero{font-size:44px;font-weight:950;color:var(--green)}
.detail-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.detail-item{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc}.detail-item .small{font-size:11px;color:var(--muted)}.detail-item .big{font-size:22px;font-weight:900;margin-top:3px}
.question-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.question-top{display:flex;justify-content:space-between;gap:12px}.q-text{font-weight:800;line-height:1.55}.answer-line{margin-top:10px;font-size:13px}.answer-line strong{font-weight:850}.answer-your{color:#a34747}.answer-correct{color:var(--green-dark)}.reference{margin-top:11px;padding:10px 12px;border-radius:10px;background:#f7faf9;border-left:4px solid var(--green);font-size:12px;color:#536173}
.empty{padding:38px 15px;text-align:center;color:var(--muted)}.empty strong{color:var(--text);display:block;margin-bottom:6px}
.alert{padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:16px}.alert.info{background:var(--blue-soft);color:#345f9b}.alert.warn{background:var(--amber-soft);color:#7f5a00}.alert.danger{background:var(--red-soft);color:#9c3f3f}
.mobile-nav{display:none}.modal{position:fixed;inset:0;background:rgba(8,20,34,.45);z-index:50;display:grid;place-items:center;padding:18px}.modal-card{width:min(900px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.mobile-overlay{display:none}.menu-toggle{display:none;border:0;background:transparent;color:var(--navy);font-size:24px;width:42px;height:42px;border-radius:12px}.topbar-left{display:flex;align-items:center;gap:10px}
.mobile-list{display:none}.mobile-rank-card,.mobile-pending-card,.mobile-location-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 4px 12px rgba(15,27,45,.04)}.mobile-rank-head,.mobile-pending-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.mobile-rank-num{width:28px;height:28px;border-radius:9px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;font-weight:900;flex:none}.mobile-rank-name{font-weight:850;line-height:1.35}.mobile-rank-meta,.mobile-pending-meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}.mobile-rank-score{font-weight:950;font-size:20px;white-space:nowrap}.mobile-pending-card{cursor:pointer}.mobile-pending-card:hover{border-color:#cde9df}.mobile-location-card{cursor:pointer}.mobile-location-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.mobile-stat{padding:8px 9px;border-radius:10px;background:#f8fafb}.mobile-stat .small{font-size:10px;color:var(--muted)}.mobile-stat .big{font-size:15px;font-weight:850;margin-top:2px}

@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}.four{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:1fr}}
@media (max-width:850px){.sidebar{display:flex;width:min(84vw,320px);transform:translateX(-105%);transition:transform .25s ease;box-shadow:18px 0 45px rgba(0,0,0,.18)}.sidebar.open{transform:translateX(0)}.mobile-overlay{display:block;position:fixed;inset:0;background:rgba(6,18,31,.42);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s ease}.mobile-overlay.open{opacity:1;pointer-events:auto}.menu-toggle{display:grid;place-items:center}.main{margin-left:0;padding-bottom:16px;min-width:0}.topbar{height:68px;padding:0 12px;position:sticky}.topbar-left{min-width:0}.topbar-left>div:last-child{min-width:0}.page-title{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.page-sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content{padding:16px 12px 26px;overflow-x:hidden}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:none}.top-actions .role-chip{display:none}.logout{height:38px;padding:0 11px}.nav{overflow-y:auto;padding-bottom:24px}.sidebar-footer{padding-bottom:24px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{min-width:760px}.card{overflow:hidden}.filters{width:100%}.filters input,.filters select{min-width:0;width:100%}.mobile-list{display:none}}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpi .value{font-size:24px}.detail-grid{grid-template-columns:1fr 1fr;gap:10px}.login-card{padding:26px}.content{padding:12px 10px 24px}.chart-wrap{height:235px}.card{padding:16px;border-radius:15px}.card-head{margin-bottom:14px}.table-wrap{display:none}.mobile-list{display:block}.mobile-rank-card{padding:12px}.mobile-rank-score{font-size:18px}.person-name{font-size:20px}.score-hero{font-size:36px}.question-card{padding:14px}.q-text{font-size:14px}.answer-line{font-size:12px}}
</style>
</head>
<body>
<div id="loginView">
  <div class="login-card">
    <div class="brand-mark">A</div>
    <h1>Assessment Results Portal</h1>
    <p>أدخل الكود الوظيفي للوصول إلى النتيجة والصلاحيات الخاصة بك.</p>
    <div class="field"><label for="loginCode">الكود الوظيفي</label><input id="loginCode" autocomplete="off" placeholder="اكتب الكود الوظيفي" /></div>
    <button class="primary" id="loginBtn">دخول</button>
    <div id="loginError" class="error hidden"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="logo-row"><div class="mini-mark">A</div><div><div class="logo-title">Assessment Portal</div><div class="logo-sub">Results &amp; Performance</div></div></div></div>
    <div class="user-box"><div class="user-name" id="sideUserName"></div><div class="user-meta" id="sideUserMeta"></div></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-footer">Temporary management portal · Data-driven</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="topbar-left"><button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة" aria-expanded="false">☰</button><div><div class="page-title" id="pageTitle"></div><div class="page-sub" id="pageSub"></div></div></div><div class="top-actions"><span id="roleChip" class="badge green role-chip"></span><button class="logout" id="logoutBtn">Logout</button></div></header>
    <div class="content" id="content"></div>
  </main>
  <nav class="mobile-nav" id="mobileNav"></nav>
</div>
<div id="modal" class="modal hidden"></div>

<script>
const DATA = { results:null, hierarchy:null, questions:null };
const STATE = { user:null, page:'dashboard', drill:{type:null,value:null}, selectedEmployee:null, charts:{} };
const $ = (s)=>document.querySelector(s);
const $$ = (s)=>Array.from(document.querySelectorAll(s));

const NAV = [
  ['dashboard','Dashboard'],['performance','Performance'],['pending','Pending Employees'],['locations','Locations'],['questions','Question Reference'],['quality','Data Quality']
];

function norm(v){ return String(v??'').trim(); }
function code(v){ return norm(v).replace(/\.0$/,''); }
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function lower(s){return norm(s).toLowerCase();}
function isEligible(row){return /(^|[^a-z])(lead|supervisor)([^a-z]|$)/i.test(norm(row.Position));}
function pct(v){const n=Number(v); return Number.isFinite(n)?`${n.toFixed(1).replace(/\.0$/,'')}%`:'—';}
function scoreClass(v){const n=Number(v);return n>=85?'good':n>=70?'mid':'low';}
function initials(name){return norm(name).split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'A';}
function average(rows, field='score_percentage'){const vals=rows.map(r=>Number(r[field])).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;}
function mean(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;}
function groupBy(rows, keyFn){const m=new Map(); for(const r of rows){const k=keyFn(r); if(!m.has(k))m.set(k,[]);m.get(k).push(r)} return m;}
function resultsMap(){const m=new Map(); DATA.results.forEach(r=>m.set(code(r.functional_code),r)); return m;}
function hierarchyMap(){const m=new Map(); DATA.hierarchy.forEach(r=>m.set(code(r['Functional Code']),r)); return m;}

function correctText(i){const q=DATA.questions[i-1]; return q?.['Correct Answer']||'';}
function optionText(i, letter){const q=DATA.questions[i-1]; return q?.[`Option ${letter}`]||'';}
function questionRow(i){return DATA.questions[i-1];}
function productForQuestion(i){const s=questionRow(i)?.Section||''; if(s.includes('المتناهي'))return 'MF'; if(s.includes('الاستهلاكي'))return 'CF'; if(s.includes('الجمعية'))return 'Gam3ya'; if(s.includes('الاستثمار'))return 'Investment'; return s;}
const PRODUCT_QS = {MF:[1,2,3,4,5],CF:[6,7,8,9,10],Gam3ya:[11,12,13],Investment:[14,15,16,17,18]};

function enrich(){
  const hm=hierarchyMap(), rm=resultsMap();
  for(const h of DATA.hierarchy){h._code=code(h['Functional Code']); h._eligible=isEligible(h); h._access=norm(h['Access Level'])|| (h._eligible?'Lead / Supervisor':'');}
  for(const r of DATA.results){r._code=code(r.functional_code); r._h=hm.get(r._code)||null; r._eligible=!!r._h&&r._h._eligible; r._displayName=r._h?norm(r._h['Employee Name']):norm(r.participant_name); r._score=Number(r.score_percentage)||0; r._products={}; for(const [p,qs] of Object.entries(PRODUCT_QS)){let c=0; for(const i of qs){if(lower(r[`q${i}`])===lower(DATA.questions[i-1]['Correct Option']))c++;} r._products[p]=c/qs.length*100;} }
}

async function loadXlsx(url,sheetName){const ab=await fetch(url).then(r=>{if(!r.ok)throw new Error(`Failed to fetch ${url}`);return r.arrayBuffer()}); const wb=XLSX.read(ab,{type:'array'}); const ws=wb.Sheets[sheetName||wb.SheetNames[0]]; return XLSX.utils.sheet_to_json(ws,{defval:''});}
async function loadCsv(url){const txt=await fetch(url).then(r=>{if(!r.ok)throw new Error(`Failed to fetch ${url}`);return r.text()}); const wb=XLSX.read(txt,{type:'string'}); const ws=wb.Sheets[wb.SheetNames[0]]; return XLSX.utils.sheet_to_json(ws,{defval:''});}
async function boot(){
  try{
    const [results,hier,questions]=await Promise.all([
      loadCsv('results.csv'), loadXlsx('hierarchy.xlsx','Hierarchy'), loadXlsx('question_bank.xlsx','Question Bank')
    ]);
    DATA.results=results; DATA.hierarchy=hier; DATA.questions=questions; enrich();
    $('#loginBtn').addEventListener('click',login); $('#loginCode').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  }catch(err){$('#loginError').textContent='تعذر تحميل ملفات البيانات. تأكد أن الملفات موجودة بجوار index.html في GitHub.';$('#loginError').classList.remove('hidden');console.error(err)}
}

function findUser(c){return DATA.hierarchy.find(h=>code(h['Functional Code'])===code(c));}
function roleOf(u){const al=norm(u['Access Level']); if(al==='Director / Head')return 'Director / Head'; if(al==='Regional Manager')return 'Regional Manager'; if(al==='City Manager')return 'City Manager'; if(u._eligible)return 'Lead / Supervisor'; return al||'Viewer';}
function descendants(userCode){
  const by=new Map(); for(const h of DATA.hierarchy){const p=code(h['Direct Manager Code']);if(!by.has(p))by.set(p,[]);by.get(p).push(h);}
  const out=[]; const stack=[code(userCode)]; const seen=new Set(); while(stack.length){const x=stack.pop(); if(seen.has(x))continue;seen.add(x); for(const child of (by.get(x)||[])){out.push(child);stack.push(child._code)}} return out;
}
function scopeEmployees(user){
  const role=roleOf(user);
  if(role==='Director / Head')return DATA.hierarchy.filter(h=>h._eligible);
  if(role==='Regional Manager'||role==='City Manager')return descendants(user._code).filter(h=>h._eligible);
  return [user].filter(h=>h._eligible);
}
function scopeResults(user){const m=resultsMap(); return scopeEmployees(user).map(h=>m.get(h._code)).filter(Boolean);}
function pendingEmployees(user){const res=resultsMap(); return scopeEmployees(user).filter(h=>!res.has(h._code));}

function login(){const c=code($('#loginCode').value); if(!c){showLoginError('من فضلك اكتب الكود الوظيفي.');return;} const u=findUser(c); if(!u){showLoginError('الكود الوظيفي غير موجود في قاعدة البيانات.');return;} STATE.user=u; STATE.page=roleOf(u)==='Lead / Supervisor'?'dashboard':'dashboard'; $('#loginView').classList.add('hidden');$('#app').classList.remove('hidden');renderShell();render();}
function showLoginError(t){$('#loginError').textContent=t;$('#loginError').classList.remove('hidden')}
function logout(){STATE.user=null;Object.assign(STATE,{page:'dashboard',drill:{type:null,value:null},selectedEmployee:null});$('#app').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#loginCode').value='';$('#loginError').classList.add('hidden');}
function renderShell(){const u=STATE.user, role=roleOf(u); $('#sideUserName').textContent=u['Employee Name']; $('#sideUserMeta').textContent=`${role} · ${u['Governorate']||'—'}`; $('#roleChip').textContent=role; buildNav(); $('#logoutBtn').onclick=logout;}
function closeMobileMenu(){const sb=$('#sidebar'),ov=$('#mobileOverlay'),btn=$('#menuToggle');sb?.classList.remove('open');ov?.classList.remove('open');btn?.setAttribute('aria-expanded','false');}
function allowedNav(){const r=roleOf(STATE.user);if(r==='Lead / Supervisor')return ['dashboard','questions'];return ['dashboard','performance','pending','locations','questions','quality'];}
function buildNav(){const allowed=allowedNav(); const mk=(btn)=>`<button data-nav="${btn[0]}" class="${STATE.page===btn[0]?'active':''}"><span class="dot"></span>${esc(btn[1])}</button>`; $('#sideNav').innerHTML=NAV.filter(x=>allowed.includes(x[0])).map(mk).join(''); $('#mobileNav').innerHTML=''; [...$$('#sideNav button')].forEach(b=>b.onclick=()=>{STATE.page=b.dataset.nav; STATE.drill={type:null,value:null}; STATE.selectedEmployee=null; closeMobileMenu(); render()});}
function setHeader(title,sub){$('#pageTitle').textContent=title;$('#pageSub').textContent=sub||'';}

function render(){buildNav(); const r=roleOf(STATE.user); if(STATE.page==='dashboard'){setHeader(r==='Lead / Supervisor'?'My Assessment':'Management Dashboard', r==='Lead / Supervisor'?'Assessment result and learning feedback':'Performance, completion and hierarchy insights'); renderDashboard();}
else if(STATE.page==='performance') {setHeader('Performance','Scores, products and rankings within your authorized scope'); renderPerformance();}
else if(STATE.page==='pending'){setHeader('Pending Employees','Employees who are required to test but have no submitted result');renderPending();}
else if(STATE.page==='locations'){setHeader('Locations','Drill down through your authorized hierarchy');renderLocations();}
else if(STATE.page==='questions'){setHeader('Question Reference','Correct answers and training references');renderQuestions();}
else if(STATE.page==='quality'){setHeader('Data Quality','Cross-check of results, hierarchy and answer mapping');renderQuality();}}

function renderDashboard(){ if(roleOf(STATE.user)==='Lead / Supervisor'){renderEmployeeDashboard(STATE.user);return;} const scope=scopeEmployees(STATE.user);const results=scopeResults(STATE.user);const pending=pendingEmployees(STATE.user); const avg=average(results); const completion=scope.length?results.length/scope.length*100:0;
  $('#content').innerHTML=`<div class="grid kpis"><div class="kpi green"><div class="label">Eligible Employees</div><div class="value">${scope.length}</div><div class="hint">Required by position</div></div><div class="kpi"><div class="label">Completed</div><div class="value">${results.length}</div><div class="hint">Matching result found</div></div><div class="kpi red"><div class="label">Not Completed</div><div class="value">${pending.length}</div><div class="hint">Click to see the actual list</div></div><div class="kpi green"><div class="label">Completion Rate</div><div class="value">${pct(completion)}</div><div class="hint">Completed ÷ eligible</div></div><div class="kpi"><div class="label">Average Score</div><div class="value">${pct(avg)}</div><div class="hint">Completed eligible employees</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="card-head"><div><h3>Product Performance</h3><div class="section-note">Average by completed eligible employee</div></div></div><div class="chart-wrap"><canvas id="productChart"></canvas></div></div><div class="card"><div class="card-head"><div><h3>Completion Overview</h3><div class="section-note">Your authorized scope</div></div></div><div class="chart-wrap"><canvas id="completionChart"></canvas></div></div></div><div id="dashboardTables" style="margin-top:16px"></div>`;
  createProductChart(results);createCompletionChart(results.length,pending.length);renderDashboardTables(scope,results,pending); wireEmployeeLinks();
}
function renderEmployeeDashboard(user){const rm=resultsMap();const r=rm.get(user._code); if(!r){setHeader('My Assessment','Your assessment status');$('#content').innerHTML=`<div class="card empty"><strong>لم يتم تسجيل الاختبار بعد</strong><div>الكود الوظيفي: ${esc(user._code)}</div><div class="muted" style="margin-top:8px">أنت ضمن الفئة المطلوبة للاختبار، لكن لا يوجد Submission مطابق حتى الآن.</div></div>`;return;} renderEmployeeDetail(r._code,true);}
function createProductChart(rows){const vals=Object.entries(PRODUCT_QS).map(([p])=>mean(rows.map(r=>r._products[p]))); if(STATE.charts.product)STATE.charts.product.destroy();STATE.charts.product=new Chart($('#productChart'),{type:'bar',data:{labels:['MF','CF','الجمعية','Investment'],datasets:[{data:vals,backgroundColor:['#00A970','#2e8bff','#7b61ff','#f2a900'],borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}},plugins:{legend:{display:false}}}})}
function createCompletionChart(done,pending){if(STATE.charts.completion)STATE.charts.completion.destroy();STATE.charts.completion=new Chart($('#completionChart'),{type:'doughnut',data:{labels:['Completed','Not Completed'],datasets:[{data:[done,pending],backgroundColor:['#00A970','#e8edf1'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'72%',plugins:{legend:{position:'bottom'}}}})}
function renderDashboardTables(scope,results,pending){const role=roleOf(STATE.user);let html=''; if(role==='Director / Head'){const byGov=rankBy(results,h=>h._h?.Governorate||'—');const byRegion=rankBy(results,h=>h._h?.Region||'—');html+=rankingCard('Strongest Governorates',byGov.slice(0,5));html+=rankingCard('Weakest Governorates',byGov.slice().sort((a,b)=>a.avg-b.avg).slice(0,5));html+=`<div class="grid two" style="margin-top:16px">${rankingCard('Strongest Regions',byRegion.slice(0,5),true)}${rankingCard('Weakest Regions',byRegion.slice().sort((a,b)=>a.avg-b.avg).slice(0,5),true)}</div>`;} else {const byCity=rankBy(results,h=>h._h?.City||'—');html+=`<div class="grid two">${rankingCard('Strongest Locations',byCity.slice(0,5),true)}${rankingCard('Weakest Locations',byCity.slice().sort((a,b)=>a.avg-b.avg).slice(0,5),true)}</div>`;} html+=`<div style="margin-top:16px" class="card"><div class="card-head"><div><h3>Pending Employees</h3><div class="section-note">${pending.length} eligible employee(s) have no submission</div></div><button class="logout" id="goPending">Open full list</button></div>${pending.length?pendingTable(pending):'<div class="empty"><strong>All eligible employees completed the assessment.</strong></div>'}</div>`; $('#dashboardTables').innerHTML=html; $('#goPending')?.addEventListener('click',()=>{STATE.page='pending';render()});}
function rankBy(rows,keyFn){const groups=groupBy(rows,keyFn);return Array.from(groups.entries()).map(([name,rs])=>({name,count:rs.length,avg:average(rs)})).filter(x=>x.name&&x.name!=='—').sort((a,b)=>b.avg-a.avg);}
function rankingCard(title,items,small=false){return `<div class="card"><div class="card-head"><div><h3>${esc(title)}</h3><div class="section-note">Average score · completed eligible employees</div></div></div>${items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Location</th><th>Employees</th><th>Average</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.count}</td><td class="score ${scoreClass(x.avg)}">${pct(x.avg)}</td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${items.map((x,i)=>`<div class="mobile-rank-card"><div class="mobile-rank-head"><div style="display:flex;gap:10px;min-width:0"><div class="mobile-rank-num">${i+1}</div><div><div class="mobile-rank-name">${esc(x.name)}</div><div class="mobile-rank-meta">${x.count} completed eligible employee(s)</div></div></div><div class="mobile-rank-score score ${scoreClass(x.avg)}">${pct(x.avg)}</div></div></div>`).join('')}</div>`:'<div class="empty">No data</div>'}</div>`}
function pendingTable(rows){const sorted=rows.slice().sort((a,b)=>`${a['Region']}|${a['Governorate']}|${a['City']}|${a['Employee Name']}`.localeCompare(`${b['Region']}|${b['Governorate']}|${b['City']}|${b['Employee Name']}`));return `<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Position</th><th>Region</th><th>Governorate</th><th>City</th><th>Code</th></tr></thead><tbody>${sorted.map(h=>`<tr><td>${esc(h['Employee Name'])}</td><td>${esc(h['Position'])}</td><td>${esc(h['Region'])}</td><td>${esc(h['Governorate'])}</td><td>${esc(h['City'])}</td><td><span class="link" data-emp="${esc(h._code)}">${esc(h._code)}</span></td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${sorted.map(h=>`<div class="mobile-pending-card"><div class="mobile-pending-head"><div><div class="mobile-rank-name">${esc(h['Employee Name'])}</div><div class="mobile-pending-meta">${esc(h['Position'])} · ${esc(h['Governorate']||'—')} · ${esc(h['City']||'—')}</div><div class="mobile-pending-meta">${esc(h['Region']||'—')} · ${esc(h._code)}</div></div><span class="badge amber">Pending</span></div></div>`).join('')}</div>`}

function renderPerformance(){const results=scopeResults(STATE.user);if(roleOf(STATE.user)==='Lead / Supervisor'){renderEmployeeDetail(STATE.user._code,true);return;} const top=results.slice().sort((a,b)=>b._score-a._score).slice(0,5);const bottom=results.slice().sort((a,b)=>a._score-b._score).slice(0,5);$('#content').innerHTML=`<div class="grid two"><div class="card"><div class="card-head"><div><h3>Top 5 Employees</h3><div class="section-note">Highest overall scores</div></div></div>${employeeRanking(top)}</div><div class="card"><div class="card-head"><div><h3>Bottom 5 Employees</h3><div class="section-note">Lowest overall scores</div></div></div>${employeeRanking(bottom)}</div></div><div class="card" style="margin-top:16px"><div class="card-head"><div><h3>All Completed Employees</h3><div class="section-note">Click any employee for full question-level feedback</div></div><div class="filters"><input id="perfSearch" placeholder="Search name or code" /></div></div><div id="perfTable"></div></div>`; renderPerfTable(results);$('#perfSearch').addEventListener('input',()=>renderPerfTable(results)); wireEmployeeLinks();}
function employeeRanking(rows){return rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Employee</th><th>Location</th><th>Score</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="link" data-emp="${esc(r._code)}">${esc(r._displayName)}</span></td><td>${esc(r._h?.Governorate||'—')}</td><td class="score ${scoreClass(r._score)}">${pct(r._score)}</td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${rows.map((r,i)=>`<div class="mobile-rank-card" data-emp="${esc(r._code)}"><div class="mobile-rank-head"><div style="display:flex;gap:10px;min-width:0"><div class="mobile-rank-num">${i+1}</div><div><div class="mobile-rank-name">${esc(r._displayName)}</div><div class="mobile-rank-meta">${esc(r._h?.Position||'—')} · ${esc(r._h?.Governorate||'—')} · ${esc(r._h?.City||'—')}</div></div></div><div class="mobile-rank-score score ${scoreClass(r._score)}">${pct(r._score)}</div></div></div>`).join('')}</div>`:'<div class="empty">No completed employees.</div>'}
function renderPerfTable(results){const q=lower($('#perfSearch')?.value);const rows=results.filter(r=>!q||lower(r._displayName).includes(q)||lower(r._code).includes(q)).sort((a,b)=>b._score-a._score);$('#perfTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Position</th><th>Governorate</th><th>City</th><th>MF</th><th>CF</th><th>الجمعية</th><th>Investment</th><th>Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="link" data-emp="${esc(r._code)}">${esc(r._displayName)}</span></td><td>${esc(r._h?.Position||'—')}</td><td>${esc(r._h?.Governorate||'—')}</td><td>${esc(r._h?.City||'—')}</td><td class="score ${scoreClass(r._products.MF)}">${pct(r._products.MF)}</td><td class="score ${scoreClass(r._products.CF)}">${pct(r._products.CF)}</td><td class="score ${scoreClass(r._products.Gam3ya)}">${pct(r._products.Gam3ya)}</td><td class="score ${scoreClass(r._products.Investment)}">${pct(r._products.Investment)}</td><td class="score ${scoreClass(r._score)}">${pct(r._score)}</td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${rows.map(r=>`<div class="mobile-rank-card" data-emp="${esc(r._code)}"><div class="mobile-rank-head"><div><div class="mobile-rank-name">${esc(r._displayName)}</div><div class="mobile-rank-meta">${esc(r._h?.Position||'—')} · ${esc(r._h?.Governorate||'—')} · ${esc(r._h?.City||'—')}</div></div><div class="mobile-rank-score score ${scoreClass(r._score)}">${pct(r._score)}</div></div><div class="mobile-location-grid"><div class="mobile-stat"><div class="small">MF</div><div class="big">${pct(r._products.MF)}</div></div><div class="mobile-stat"><div class="small">CF</div><div class="big">${pct(r._products.CF)}</div></div><div class="mobile-stat"><div class="small">الجمعية</div><div class="big">${pct(r._products.Gam3ya)}</div></div><div class="mobile-stat"><div class="small">Investment</div><div class="big">${pct(r._products.Investment)}</div></div></div></div>`).join('')}</div>`;wireEmployeeLinks();}

function renderPending(){if(roleOf(STATE.user)==='Lead / Supervisor'){renderEmployeeDashboard(STATE.user);return;}const pending=pendingEmployees(STATE.user); const grouped=groupBy(pending,h=>`${h['Region']}||${h['Governorate']}||${h['City']}`); const entries=Array.from(grouped.entries()).sort(); let html=`<div class="alert info">الأرقام هنا تخص فقط الموظفين المطلوب منهم الاختبار حسب الـPosition: Lead / Supervisor.</div>`; if(!pending.length) html+='<div class="card empty"><strong>لا يوجد موظفون متأخرون.</strong>كل الموظفين المطلوب منهم الاختبار لديهم Submission.</div>'; else for(const [g,rs] of entries){const [reg,gov,city]=g.split('||');html+=`<div class="card" style="margin-bottom:14px"><div class="card-head"><div><h3>${esc(gov)}${city&&city!==gov?' · '+esc(city):''}</h3><div class="section-note">${esc(reg)} · ${rs.length} pending</div></div></div>${pendingTable(rs)}</div>`;} $('#content').innerHTML=html;wireEmployeeLinks();}

function renderLocations(){if(roleOf(STATE.user)==='Lead / Supervisor'){renderEmployeeDashboard(STATE.user);return;} const scope=scopeEmployees(STATE.user), results=scopeResults(STATE.user); const grouped=groupBy(results,h=>h._h?.Governorate||'—'); const rows=Array.from(grouped.entries()).map(([name,rs])=>({name,results:rs,pending:scope.filter(h=>(h['Governorate']||'—')===name&&!resultsMap().has(h._code)).length,avg:average(rs)})).sort((a,b)=>b.avg-a.avg);
 $('#content').innerHTML=`<div class="card"><div class="card-head"><div><h3>Authorized Locations</h3><div class="section-note">Click a row to drill down to employees.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Governorate</th><th>Eligible</th><th>Completed</th><th>Pending</th><th>Completion</th><th>Average</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="link" data-loc="${esc(r.name)}">${esc(r.name)}</span></td><td>${scope.filter(h=>(h['Governorate']||'—')===r.name).length}</td><td>${r.results.length}</td><td>${r.pending}</td><td>${pct((r.results.length/(scope.filter(h=>(h['Governorate']||'—')===r.name).length||1))*100)}</td><td class="score ${scoreClass(r.avg)}">${pct(r.avg)}</td></tr>`).join('')}</tbody></table></div></div><div id="locationDetail" style="margin-top:16px"></div>`;
 $$('#content [data-loc]').forEach(el=>el.addEventListener('click',()=>showLocation(el.dataset.loc)));}
function showLocation(loc){const scope=scopeEmployees(STATE.user).filter(h=>h['Governorate']===loc);const res=scopeResults(STATE.user).filter(r=>r._h?.Governorate===loc);const pending=scope.filter(h=>!resultsMap().has(h._code));const all=res.concat(pending.map(h=>({_pending:true,_code:h._code,_displayName:h['Employee Name'],_h:h,_score:null}))).sort((a,b)=>String(a._displayName).localeCompare(String(b._displayName)));$('#locationDetail').innerHTML=`<div class="card"><div class="card-head"><div><h3>${esc(loc)}</h3><div class="section-note">Employee-level drill down</div></div></div>${all.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Position</th><th>City</th><th>Score</th><th>Status</th></tr></thead><tbody>${all.map(r=>`<tr><td><span class="link" data-emp="${esc(r._code)}">${esc(r._displayName)}</span></td><td>${esc(r._h?.Position||'—')}</td><td>${esc(r._h?.City||'—')}</td><td>${r._pending?'<span class="badge amber">Pending</span>':`<span class="score ${scoreClass(r._score)}">${pct(r._score)}</span>`}</td><td>${r._pending?'<span class="badge amber">Not Completed</span>':'<span class="badge green">Completed</span>'}</td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${all.map(r=>`<div class="mobile-location-card" data-emp="${esc(r._code)}"><div class="mobile-rank-head"><div><div class="mobile-rank-name">${esc(r._displayName)}</div><div class="mobile-pending-meta">${esc(r._h?.Position||'—')} · ${esc(r._h?.City||'—')}</div></div>${r._pending?'<span class="badge amber">Pending</span>':`<span class="score ${scoreClass(r._score)}">${pct(r._score)}</span>`}</div></div>`).join('')}</div>`:'<div class="empty">No eligible employees in this location.</div>'}</div>`;wireEmployeeLinks();}

function renderQuestions(){const qs=DATA.questions; $('#content').innerHTML=`<div class="card"><div class="card-head"><div><h3>18-Question Reference Library</h3><div class="section-note">Correct answers and training references only. This is not an exam.</div></div></div>${qs.map((q,i)=>`<div class="question-card"><div class="question-top"><div><span class="badge green">${esc(q['Q#'])}</span> <span class="badge">${esc(q['Section'])}</span></div><span class="badge blue">Correct: ${esc(q['Correct Option'])}</span></div><div class="q-text" style="margin-top:11px">${esc(q['Question'])}</div><div class="answer-line answer-correct"><strong>الإجابة الصحيحة:</strong> ${esc(q['Correct Answer'])}</div><div class="reference"><strong>Reference:</strong> ${esc(q['Reference']||'—')}</div></div>`).join('')}</div>`;}

function renderQuality(){const hm=hierarchyMap(), rm=resultsMap();const duplicateCodes=[];const seen=new Set();for(const h of DATA.hierarchy){if(seen.has(h._code))duplicateCodes.push(h._code);seen.add(h._code)}const resultOrphans=DATA.results.filter(r=>!hm.has(r._code));const nonEligible=DATA.results.filter(r=>hm.has(r._code)&&!hm.get(r._code)._eligible);const pending=DATA.hierarchy.filter(h=>h._eligible&&!rm.has(h._code));let scoreMismatch=0;for(const r of DATA.results){let c=0;for(let i=1;i<=18;i++){if(lower(r[`q${i}`])===lower(DATA.questions[i-1]['Correct Option']))c++;}if(c!==Number(r.total_correct))scoreMismatch++;}
 $('#content').innerHTML=`<div class="grid four"><div class="kpi"><div class="label">Hierarchy Records</div><div class="value">${DATA.hierarchy.length}</div></div><div class="kpi green"><div class="label">Eligible</div><div class="value">${DATA.hierarchy.filter(h=>h._eligible).length}</div></div><div class="kpi"><div class="label">Results</div><div class="value">${DATA.results.length}</div></div><div class="kpi ${scoreMismatch?'red':'green'}"><div class="label">Score Mismatches</div><div class="value">${scoreMismatch}</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Checks</h3><div style="margin-top:14px">${checkLine('Duplicate hierarchy codes',duplicateCodes.length,0)}${checkLine('Result codes missing from hierarchy',resultOrphans.length,0)}${checkLine('Non-eligible employees with results',nonEligible.length,null,true)}${checkLine('Eligible employees without results',pending.length,null,true)}${checkLine('Stored score mismatches',scoreMismatch,0)}</div></div><div class="card"><h3>Important data note</h3><div class="alert warn" style="margin-top:14px">The portal uses Position to decide who is required to test, and Access Level + Direct Manager Code to decide what each logged-in user can see.</div><div class="section-note">The 24 non-eligible submissions are retained for data quality visibility but are excluded from completion-rate metrics.</div></div></div>`;}
function checkLine(label,val,expected,warning=false){const ok=expected===null?true:val===expected; return `<div style="display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eef1f4"><span>${esc(label)}</span><span class="badge ${ok?'green':warning?'amber':'red'}">${val}</span></div>`;}

function renderEmployeeDetail(empCode,self){const h=hierarchyMap().get(code(empCode));const r=resultsMap().get(code(empCode));if(!h)return; if(!self&&!canAccessEmployee(h))return; const incorrect=[]; let overall=0; if(r){overall=r._score;for(let i=1;i<=18;i++){const chosen=norm(r[`q${i}`]).toUpperCase();const correct=norm(questionRow(i)?.['Correct Option']).toUpperCase(); if(chosen!==correct) incorrect.push({i,q:questionRow(i),chosenLetter:chosen,chosenText:chosen?optionText(i,chosen):'لم تتم الإجابة'});}}
  STATE.selectedEmployee=empCode; setHeader(h['Employee Name'], `${h['Position']} · ${h['Governorate']||'—'} · ${h['City']||'—'}`); $('#content').innerHTML=`<div class="drill"><button class="crumb active" id="backBtn">← Back</button></div><div class="card"><div class="person-head"><div class="person-main"><div class="avatar">${esc(initials(h['Employee Name']))}</div><div><div class="person-name">${esc(h['Employee Name'])}</div><div class="person-meta">${esc(h._code)} · ${esc(h['Position'])} · ${esc(h['Governorate']||'—')} · ${esc(h['Region']||'—')} · ${esc(h['City']||'—')}</div></div></div><div class="score-hero">${r?pct(overall):'Pending'}</div></div></div>${r?employeeDetailBody(r,incorrect):pendingDetailBody(h)}`; $('#backBtn').onclick=()=>{STATE.page=roleOf(STATE.user)==='Lead / Supervisor'?'dashboard':'performance';STATE.selectedEmployee=null;render()};}
function canAccessEmployee(h){const role=roleOf(STATE.user);if(role==='Director / Head')return true; if(role==='Lead / Supervisor')return h._code===STATE.user._code; return scopeEmployees(STATE.user).some(x=>x._code===h._code);}
function employeeDetailBody(r,incorrect){return `<div class="grid detail-grid" style="margin-top:16px">${[['Overall',r._score],['MF',r._products.MF],['CF',r._products.CF],['الجمعية',r._products.Gam3ya],['Investment',r._products.Investment]].map(([l,v])=>`<div class="detail-item"><div class="small">${l}</div><div class="big score ${scoreClass(v)}">${pct(v)}</div></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="card-head"><div><h3>Incorrect Questions</h3><div class="section-note">Only the questions answered incorrectly or left unanswered.</div></div><span class="badge ${incorrect.length?'red':'green'}">${incorrect.length} issue(s)</span></div>${incorrect.length?incorrect.map(x=>`<div class="question-card"><div class="question-top"><span class="badge">Q${x.i}</span><span class="badge">${esc(x.q['Section'])}</span></div><div class="q-text" style="margin-top:11px">${esc(x.q['Question'])}</div><div class="answer-line answer-your"><strong>إجابتك:</strong> ${esc(x.chosenText)}</div><div class="answer-line answer-correct"><strong>الإجابة الصحيحة:</strong> ${esc(x.q['Correct Answer'])}</div><div class="reference"><strong>Reference:</strong> ${esc(x.q['Reference']||'—')}</div></div>`).join(''):'<div class="empty"><strong>ممتاز — لا توجد أخطاء.</strong>كل الـ18 سؤال تمت الإجابة عليها بشكل صحيح.</div>'}</div>`;}
function pendingDetailBody(h){return `<div class="alert warn" style="margin-top:16px"><strong>Not Completed</strong><div style="margin-top:4px">This employee is required to take the assessment but has no matching result yet.</div></div>`}

boot();
$('#menuToggle').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open'); if(open){$('#sidebar').classList.add('open');$('#mobileOverlay').classList.add('open');$('#menuToggle').setAttribute('aria-expanded','true');}else{closeMobileMenu();}});
$('#mobileOverlay').addEventListener('click',closeMobileMenu);
window.addEventListener('resize',()=>{if(window.innerWidth>850)closeMobileMenu();});
</script>
</body>
</html>
